name: dovetail_updater
description: >-
  Reads an update manifest and verifies a downloaded artefact against a
  minisign public key, byte compatible with what is already installed in the
  field.
version: 0.1.1
repository: https://github.com/mateussiqueira/dovetail
issue_tracker: https://github.com/mateussiqueira/dovetail/issues

environment:
  sdk: ^3.12.0

dependencies:
  dovetail_process_runner: ^0.1.0
  ed25519_edwards: ^0.3.2
  path: ^1.9.0
  pointycastle: ^4.0.0
  pub_semver: ^2.1.5

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
