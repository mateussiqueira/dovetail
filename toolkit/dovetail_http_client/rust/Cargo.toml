[package]
name = "dovetail_http_client"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

[lib]
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
  "crypto-rust",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
