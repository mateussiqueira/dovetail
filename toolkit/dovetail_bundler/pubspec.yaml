name: dovetail_bundler
description: >-
  Build orchestrator for Flutter desktop apps with a Rust core: stages what a platform installer needs and drives the tool that produces it, on Windows, macOS and Linux.
version: 0.1.0
repository: https://github.com/mateussiqueira/dovetail
issue_tracker: https://github.com/mateussiqueira/dovetail/issues

environment:
  sdk: ^3.12.0

dependencies:
  dovetail_process_runner: ^0.1.0
  archive: ^4.0.0
  args: ^2.6.0
  crypto: ^3.0.6
  image: ^4.9.2
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
