name: dovetail_platform_channel
description: >-
  Flutter access to desktop OS surfaces: window frame, system tray, login item,
  deep links, notifications and handoff to the default app, on Windows, macOS
  and Linux.
version: 0.1.1
repository: https://github.com/mateussiqueira/dovetail
issue_tracker: https://github.com/mateussiqueira/dovetail/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  async: ^2.13.0
  flutter:
    sdk: flutter
  app_links: ^7.2.1
  path: ^1.9.0
  flutter_local_notifications: ^22.3.0
  launch_at_startup: ^0.5.1
  package_info_plus: ^8.0.0
  screen_retriever: ^0.2.0
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  ffi: ^2.1.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  plugin:
    platforms:
      # Os tres, desde 09/09/2026. Ate entao so o Windows tinha nativo proprio
      # — o guarda de instancia unica —, e macOS e Linux vinham inteiros de
      # plugins do pub.dev. A sonda de aparencia nao tinha como vir de la: os
      # plugins de tema devolvem claro/escuro, porque e o que o Flutter modela,
      # e o terceiro estado se perdia antes de chegar.
      #
      # `ffiPlugin` nos tres, e nao canal de metodo: o ABI e uma funcao C que
      # devolve um inteiro, e um canal para isso seria serializacao, fila de
      # mensagens e assincronia para ler um numero.
      windows:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      linux:
        ffiPlugin: true
