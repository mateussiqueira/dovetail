[package]
name = "dovetail_privileged_channel"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
# Nao vai para o crates.io de proposito: o consumidor o alcanca por
# dependencia git do repositorio publico (MIT), e um segundo registro
# para manter em sincronia nao compra nada. Provado: um crate de fora
# compila contra ele so com a linha `git = ...`.
publish = false

[lib]
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
