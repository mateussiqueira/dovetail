name: dovetail_screenshots
description: >-
  Capture Flutter desktop screens as PNG files across screen and state
  combinations, without pumpAndSettle and with the icon fonts loaded.
version: 0.1.0
repository: https://github.com/mateussiqueira/dovetail
issue_tracker: https://github.com/mateussiqueira/dovetail/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - fonts/MaterialIcons-Regular.otf
    - fonts/CupertinoIcons.ttf
