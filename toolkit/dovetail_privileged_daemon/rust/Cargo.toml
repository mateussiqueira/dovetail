[package]
name = "dovetail_privileged_daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
publish = false

[lib]
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dovetail_privileged_channel = { path = "../../dovetail_privileged_channel/rust" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = ["Win32_System_Pipes"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
