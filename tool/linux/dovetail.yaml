identifier: com.example.demoApp
name: Demo
manufacturer: Example Org
targets:
  - linux-aarch64
service:
  name: demo-app-helper.service
  description: Privileged helper for the demo app
  exec-start: /usr/lib/demo_app/demo_app --helper
  capabilities:
    - CAP_NET_ADMIN
  runtime-directory: demo-app
  state-directory: demo-app
  purge-paths:
    - /var/lib/demo-app
  polkit:
    action: com.example.demoApp.manage
    vendor: Example Org
    description: Manage the demo app
    message: Authentication is required to manage the demo app
